<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <!-- Required for the glasses to accept this page as a Web App tile. -->
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Hangman</title>
<style>
  /* Inlined rather than linked. The platform has no offline support and refetches
     the page on every launch, so a separate stylesheet is a second round trip
     your friend spends waiting for you. */
  :root {
    --ground: #000000;
    --content: #f2f4f8;
    --dim: #7d8490;
    --focus: #ffb020;
    /* Just visible against black, so the keys read as a grid without 26 of them
       competing with the one that is focused. */
    --line: #2c313a;
    /* A letter that has been guessed. Below the live keys and above the grid
       lines: still readable, plainly finished with. */
    --spent: #565e6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--ground); color: var(--content);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; touch-action: none;
  }
  /* One card, one screen visible at a time. Every screen is exactly 600x600 and
     lays itself out within that, because there is no scrolling anywhere, ever. */
  .screen {
    width: 600px; height: 600px;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 48px;
  }
  .screen[hidden] { display: none; }
  /* Screens that are a message rather than a place. Nothing on them is anchored
     to an edge, so the whole card centres as one block. */
  .screen--center { justify-content: center; }

  .wordmark {
    flex: 1 1 auto;
    display: flex; align-items: center;
    font-size: 76px; font-weight: 700; letter-spacing: 0.14em;
    /* Letter-spacing pads the right edge as well as the gaps; the indent puts
       the wordmark back on the card's centre line. */
    text-indent: 0.14em;
  }

  /* One notch below the wordmark. These headlines carry a whole screen on their
     own, so they are sized to be read at a glance rather than looked at. */
  .headline {
    flex: none; text-align: center;
    font-size: 54px; font-weight: 700; letter-spacing: 0.12em;
    text-indent: 0.12em;
  }

  .options { flex: none; width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
  /* The focused option is marked by a filled bar and a solid border, not by
     colour alone. An additive waveguide renders black as transparent and washes
     mid-tones out, so a hue difference on its own is not a reliable signal in a
     bright room. */
  .option {
    display: grid; grid-template-columns: 28px 1fr; align-items: center;
    padding: 16px 20px;
    border: 2px solid transparent; border-radius: 10px;
    font-size: 28px; font-weight: 600; color: var(--dim);
  }
  .option::before { content: ''; }
  .option--focused {
    border-color: var(--focus); color: var(--ground); background: var(--focus);
  }
  .option--focused::before { content: '\25B6'; font-size: 20px; }

  .notice { flex: none; margin-top: 22px; text-align: center; font-size: 24px; line-height: 1.4; color: var(--dim); }

  /* The mystery word. Monospaced so a dash and the letter that replaces it take
     the same width — the word must not shuffle sideways underneath a player as
     it fills in. The longest word in the list is eight letters, which at this
     size and spacing is 415px of the card's 504px of usable width, and the line
     box stays inside the 70px this row is budgeted in the play layout. */
  .word {
    flex: none;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 64px; font-weight: 700; line-height: 1.05;
    /* Letter-spacing pads the right edge as well as the gaps; the indent puts
       the word back on the card's centre line. */
    letter-spacing: 0.2em; text-indent: 0.2em;
    white-space: nowrap;
  }

  /* The play card is the one screen with four things stacked on it, so its
     height is budgeted rather than centred: 552px of usable height holding a
     67px word line, a 36px turn line and a 254px keyboard, which leaves 195px
     for the gallows. That is close to the split the design was drawn to —
     roughly 220px of gallows, 70px of word and 260px of keyboard inside 50px of
     padding — with the turn line taken out of the gallows, because the gallows
     is the only part that can be drawn to whatever it is given and the only one
     with room to give.

     The vertical padding is tighter than the other screens', which have one
     thing on them and can afford to be generous. */
  .screen--play { padding: 24px 48px; justify-content: flex-start; }

  /* Inline SVG rather than an image: it stays sharp at whatever height the
     layout gives it, needs no hosting on a platform that refetches the page
     every launch, and costs almost nothing in page weight. It is drawn to the
     space that is left rather than to a fixed size — the only part of the card
     that can be. */
  .gallows {
    flex: 1 1 auto; width: 100%; min-height: 0; display: block;
    fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;
  }
  /* The frame is context and the figure is the signal, so the frame sits one
     step back. Both are shapes rather than colours: what a player reads off this
     is how many parts are drawn, which survives a waveguide washing every
     mid-tone out. */
  .gallows-frame { stroke: var(--dim); }
  .gallows-part { stroke: var(--content); display: none; }
  .gallows-part--drawn { display: inline; }

  /* Whose turn it is. Small, because it is a status line rather than a thing to
     look at, and the word above it is what the player is reading. The two states
     differ in their words as well as their colour: an additive waveguide washes
     mid-tones out, so a hue on its own is not a signal in a bright room. */
  .status {
    flex: none; margin-top: 12px;
    font-size: 22px; font-weight: 600; line-height: 1.1;
    letter-spacing: 0.1em; text-indent: 0.1em;
    color: var(--dim);
  }
  .status--mine { color: var(--focus); }
  /* How the game finished, in the place the turn was, because a game that has
     ended has no next player. Bigger than a status line and no bigger than the
     36px this row is budgeted at, so the gallows the players have just filled in
     does not shrink underneath the moment they want to look at it. The two
     endings differ in their words before their colour. */
  .status--won, .status--lost {
    font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-indent: 0.14em;
  }
  .status--won { color: var(--focus); }
  .status--lost { color: var(--content); }

  /* Six columns and five rows, which is where 26 letters land: the last row
     holds only Y and Z, and starts at the left edge with the rest. */
  .keyboard {
    flex: none; margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(6, 64px);
    justify-content: center;
    gap: 8px;
  }
  /* The focused key is marked by a filled block and a solid border, not by
     colour alone. An additive waveguide renders black as transparent and washes
     mid-tones out, so a hue difference on its own is not a reliable signal in a
     bright room — the same reason the lobby's focused option is a filled bar. */
  .key {
    height: 42px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--line); border-radius: 8px;
    font-size: 26px; font-weight: 600; line-height: 1;
  }
  .key--focused {
    border-color: var(--focus); color: var(--ground); background: var(--focus);
  }
  /* A letter that has been guessed is out of play. It stays legible — which
     letters have been spent is part of reading the board — but loses its border,
     so the grid the cursor moves around is the set of keys that still do
     something. The cursor never stops on one of these. */
  .key--guessed { border-color: transparent; color: var(--spent); }
  /* The other player's turn, or a game that has ended. The whole keyboard goes
     back, and no key is focused, because a highlighted key on a keyboard that
     will not answer is an invitation to press it. */
  .keyboard--locked { opacity: 0.45; }

  /* What the play card shows in place of the keyboard once the game is over.
     It takes exactly the keyboard's 242px, so the gallows the players have just
     filled in does not resize underneath them the moment they want to look at
     it, and the ending stays where it was on the card. */
  .endgame {
    flex: none; width: 100%; height: 242px; margin-top: 12px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  /* Both of these set their own display, so the browser's own rule for a hidden
     element is not enough to put either of them away. */
  .keyboard[hidden], .endgame[hidden] { display: none; }
  /* Why a player who has accepted a rematch is waiting. The line keeps its place
     whether or not it has anything to say, so agreeing to another round does not
     shunt the two options up the card underneath the press that did it. */
  .endgame-notice {
    flex: none; min-height: 26px; text-align: center;
    font-size: 22px; line-height: 1.2; color: var(--dim);
  }
</style>
</head>
<body>
  <main class="screen" id="screen-lobby">
    <h1 class="wordmark">HANGMAN</h1>
    <div class="options">
      <div class="option" data-option="solo">Play solo</div>
      <div class="option" data-option="connect">Connect to local game</div>
      <div class="option" data-option="exit">Exit App</div>
    </div>
  </main>

  <!-- The pause between pressing Connect and a friend appearing is the longest
       one in the app, and it is the one a player is most likely to read as a
       hang. It says what it is waiting for, and it carries its own way out. -->
  <main class="screen screen--center" id="screen-waiting" hidden>
    <h1 class="headline">WAITING</h1>
    <p class="notice">Waiting for another player to connect.<br>The game starts as soon as they do.</p>
    <div class="options">
      <div class="option" data-option="leave-waiting">Back to Lobby</div>
    </div>
  </main>

  <!-- The play card, in the order a player reads it: how much danger we are in,
       what we have got so far, and what we can press. The keys themselves are
       written in by the renderer from the one alphabet the reducer owns. -->
  <main class="screen screen--play" id="screen-playing" hidden>
    <!-- Seven states, from the empty gallows through six body parts, one per
         wrong guess. The frame is always there; the renderer reveals the parts
         in the order they are written, so document order is the order the
         figure is drawn in. -->
    <svg class="gallows" viewBox="0 0 160 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g class="gallows-frame">
        <path d="M 6 195 H 94"></path>
        <path d="M 40 195 V 12"></path>
        <path d="M 40 12 H 125"></path>
        <path d="M 125 12 V 38"></path>
      </g>
      <circle class="gallows-part" data-part cx="125" cy="55" r="17"></circle>
      <path class="gallows-part" data-part d="M 125 72 V 132"></path>
      <path class="gallows-part" data-part d="M 125 88 L 98 113"></path>
      <path class="gallows-part" data-part d="M 125 88 L 152 113"></path>
      <path class="gallows-part" data-part d="M 125 132 L 100 168"></path>
      <path class="gallows-part" data-part d="M 125 132 L 150 168"></path>
    </svg>
    <p class="word" data-word></p>
    <!-- Whose turn it is while the game is on and how it finished once it is
         over, directly above the keyboard it governs, because it is the answer
         to "why did nothing happen when I pressed that". -->
    <p class="status" data-status></p>
    <div class="keyboard" data-keyboard></div>
    <!-- The end of the game, in the space the keyboard was in: another round, or
         out. A rematch takes both players, so the line above the options says so
         to whichever of them is waiting on the other. -->
    <div class="endgame" data-endgame hidden>
      <p class="endgame-notice" data-endgame-notice></p>
      <div class="option" data-option="rematch">Play again</div>
      <div class="option" data-option="exit-to-lobby">Exit to Lobby</div>
    </div>
  </main>

  <!-- Every dead end the app has, sharing one screen. All of them report
       something that has already happened and all of them lead back to the
       lobby on their own, so the only thing that differs is the headline. -->
  <main class="screen screen--center" id="screen-notice" hidden>
    <h1 class="headline" data-notice-headline>PARTNER LEFT</h1>
    <p class="notice">Returning to the lobby.</p>
  </main>

  <!-- Shown only if the platform declines to close the page, which is what a
       desktop browser does for any page a script did not open. On the glasses
       the app is gone before this is ever seen. -->
  <main class="screen screen--center" id="screen-exited" hidden>
    <p class="notice">Closed. You can leave this page.</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
