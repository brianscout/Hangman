<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <!-- Required for the glasses to accept this page as a Web App tile. -->
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Hangman</title>
<style>
  /* Inlined rather than linked. The platform has no offline support and refetches
     the page on every launch, so a separate stylesheet is a second round trip
     your friend spends waiting for you. */
  :root {
    --ground: #000000;
    --content: #f2f4f8;
    --dim: #7d8490;
    --focus: #ffb020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--ground); color: var(--content);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; touch-action: none;
  }
  /* One card, one screen visible at a time. Every screen is exactly 600x600 and
     lays itself out within that, because there is no scrolling anywhere, ever. */
  .screen {
    width: 600px; height: 600px;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 48px;
  }
  .screen[hidden] { display: none; }

  .wordmark {
    flex: 1 1 auto;
    display: flex; align-items: center;
    font-size: 76px; font-weight: 700; letter-spacing: 0.14em;
    /* Letter-spacing pads the right edge as well as the gaps; the indent puts
       the wordmark back on the card's centre line. */
    text-indent: 0.14em;
  }

  .options { flex: none; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  /* The focused option is marked by a filled bar and a solid border, not by
     colour alone. An additive waveguide renders black as transparent and washes
     mid-tones out, so a hue difference on its own is not a reliable signal in a
     bright room. */
  .option {
    display: grid; grid-template-columns: 28px 1fr; align-items: center;
    padding: 16px 20px;
    border: 2px solid transparent; border-radius: 10px;
    font-size: 28px; font-weight: 600; color: var(--dim);
  }
  .option::before { content: ''; }
  .option--focused {
    border-color: var(--focus); color: var(--ground); background: var(--focus);
  }
  .option--focused::before { content: '\25B6'; font-size: 20px; }

  .notice { flex: 1 1 auto; display: flex; align-items: center; font-size: 24px; color: var(--dim); }
</style>
</head>
<body>
  <main class="screen" id="screen-lobby">
    <h1 class="wordmark">HANGMAN</h1>
    <div class="options">
      <div class="option" data-option="connect">Connect to local game</div>
      <div class="option" data-option="exit">Exit App</div>
    </div>
  </main>

  <!-- Shown only if the platform declines to close the page, which is what a
       desktop browser does for any page a script did not open. On the glasses
       the app is gone before this is ever seen. -->
  <main class="screen" id="screen-exited" hidden>
    <p class="notice">Closed. You can leave this page.</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
