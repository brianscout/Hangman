<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <!-- Required for the glasses to accept this page as a Web App tile. -->
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Hangman — connectivity probe</title>
<style>
  /* Inlined rather than linked. This page is a diagnostic: it has to render
     even if something else in the repo is broken, and it must survive being
     the only file that works. */
  :root {
    --ground: #000000;
    --content: #f2f4f8;
    --ok: #4ade80;
    --fail: #ff6b6b;
    --pending: #ffb020;
    --dim: #7d8490;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--ground); color: var(--content);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px; line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    user-select: none; touch-action: none;
  }
  .screen { width: 600px; height: 600px; display: flex; flex-direction: column; padding: 28px 32px; gap: 14px; }
  .title { font-size: 24px; font-weight: 700; flex: none; letter-spacing: 0.01em; }
  .probes { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 11px; }
  .probe { display: grid; grid-template-columns: 18px 1fr; column-gap: 12px; align-items: start; }
  /* A filled mark reads as present on an additive waveguide; an outline reads
     as absent. Colour alone is not the signal, because the display washes
     hues out badly in a bright room. */
  .probe__mark { font-size: 17px; line-height: 1.35; color: var(--dim); }
  .probe__label { font-size: 17px; font-weight: 600; color: var(--dim); }
  .probe__detail { grid-column: 2; font-size: 14px; color: var(--dim); }
  .probe--running .probe__mark, .probe--running .probe__label { color: var(--pending); }
  .probe--pass .probe__mark, .probe--pass .probe__label { color: var(--ok); }
  .probe--pass .probe__detail { color: var(--content); }
  .probe--fail .probe__mark, .probe--fail .probe__label { color: var(--fail); }
  .probe--fail .probe__detail { color: var(--content); }
  .footer { flex: none; display: flex; flex-direction: column; gap: 4px; }
  .verdict { font-size: 17px; font-weight: 600; color: var(--pending); }
  .keys { font-size: 14px; color: var(--dim); }
  .keys strong { color: var(--content); font-weight: 600; }
</style>
</head>
<body>
  <main class="screen">
    <h1 class="title">Connectivity probe</h1>
    <div class="probes" id="probes"></div>
    <div class="footer">
      <p class="verdict" id="verdict">Running&hellip;</p>
      <p class="keys" id="keys">Keys seen: <strong>none</strong></p>
    </div>
  </main>

<script type="module">
// Answers one question before any of the game gets built: can a Web App running
// on the glasses hold a live connection to a third-party origin?
//
// If it cannot, the whole Firebase multiplayer design is dead, and we want to
// know that now rather than after the game is written. There is no console to
// read on the glasses, so every result has to render on the card itself.
//
// Probes 1-3 need no Firebase project and answer most of the question on their
// own. Probe 4 is the authoritative one and runs only once src/firebase-config.js
// is filled in. Probe 5 is passive and confirms the input vocabulary on real
// hardware for free, since we are already wearing the device.

import { firebaseConfig } from '../src/firebase-config.js';

const FIREBASE_VERSION = '10.12.5';
const CDN = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
const TIMEOUT_MS = 8000;

// --- rendering ------------------------------------------------------------

const MARKS = { idle: '○', running: '◌', pass: '●', fail: '✕' };

const PROBES = [
  { id: 'fetch', label: '1. Cross-origin fetch' },
  { id: 'import', label: '2. ES module from CDN' },
  { id: 'websocket', label: '3. WebSocket to third party' },
  { id: 'firebase', label: '4. Firebase RTDB round trip' },
  { id: 'input', label: '5. Input vocabulary' },
];

const state = new Map(PROBES.map((probe) => [probe.id, { status: 'idle', detail: 'waiting' }]));
const nodes = new Map();

function buildDom() {
  const container = document.getElementById('probes');
  container.replaceChildren();
  for (const probe of PROBES) {
    const row = document.createElement('div');
    row.className = 'probe';
    const mark = document.createElement('span');
    mark.className = 'probe__mark';
    const label = document.createElement('span');
    label.className = 'probe__label';
    label.textContent = probe.label;
    const detail = document.createElement('span');
    detail.className = 'probe__detail';
    row.append(mark, label, detail);
    container.append(row);
    nodes.set(probe.id, { row, mark, detail });
  }
  render();
}

function set(id, status, detail) {
  state.set(id, { status, detail });
  render();
}

function render() {
  for (const [id, { status, detail }] of state) {
    const node = nodes.get(id);
    if (!node) continue;
    node.row.className = `probe probe--${status}`;
    node.mark.textContent = MARKS[status] ?? MARKS.idle;
    node.detail.textContent = detail;
  }
}

// --- helpers --------------------------------------------------------------

// Every probe is wrapped so a hang reports as a timeout rather than leaving the
// card stuck on "running" with no explanation.
function withTimeout(promise, ms, what) {
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      setTimeout(() => reject(new Error(`timed out after ${ms / 1000}s (${what})`)), ms);
    }),
  ]);
}

const since = (t0) => `${Math.round(performance.now() - t0)}ms`;

// --- probes ---------------------------------------------------------------

async function probeFetch() {
  set('fetch', 'running', CDN.replace('https://', ''));
  const t0 = performance.now();
  // cache: 'no-store' so a warm cache cannot report success for a network that
  // is actually blocked.
  const response = await withTimeout(
    fetch(`${CDN}/firebase-app.js`, { cache: 'no-store' }), TIMEOUT_MS, 'fetch');
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const body = await response.text();
  set('fetch', 'pass', `HTTP ${response.status}, ${(body.length / 1024).toFixed(0)}KB in ${since(t0)}`);
}

async function probeImport() {
  set('import', 'running', 'importing firebase-app.js');
  const t0 = performance.now();
  const module = await withTimeout(import(`${CDN}/firebase-app.js`), TIMEOUT_MS, 'import');
  if (typeof module.initializeApp !== 'function') {
    throw new Error('module loaded but initializeApp missing');
  }
  set('import', 'pass', `initializeApp available in ${since(t0)}`);
}

// Firebase RTDB prefers a WebSocket and falls back to long-polling, so this
// probe failing is survivable — but it is the difference between instant sync
// and a laggy one, and worth knowing separately.
//
// Several endpoints, because a single public echo service being down would
// otherwise report as "the glasses block WebSockets" — which is exactly the
// wrong conclusion to draw. echo.websocket.events was already dead once during
// development. Any one opening proves the transport is available.
const WS_ENDPOINTS = [
  'wss://echo.websocket.org',
  'wss://ws.postman-echo.com/raw',
  'wss://echo.websocket.events',
];

function openSocket(url) {
  return new Promise((resolve, reject) => {
    let socket;
    try {
      socket = new WebSocket(url);
    } catch (error) {
      reject(new Error(`constructor threw: ${error.message}`));
      return;
    }
    socket.addEventListener('open', () => { socket.close(); resolve(); });
    socket.addEventListener('error', () => reject(new Error('refused or blocked')));
  });
}

async function probeWebSocket() {
  const failures = [];
  for (const url of WS_ENDPOINTS) {
    const host = url.replace('wss://', '');
    set('websocket', 'running', host);
    const t0 = performance.now();
    try {
      await withTimeout(openSocket(url), TIMEOUT_MS, host);
      set('websocket', 'pass', `${host} open in ${since(t0)} (echo, not Firebase)`);
      return;
    } catch (error) {
      failures.push(host);
    }
  }
  throw new Error(`all ${failures.length} endpoints failed: ${failures.join(', ')}`);
}

// The authoritative probe. A live listener plus a write/read round trip is
// exactly what the game does, so passing here means the design holds.
async function probeFirebase() {
  if (!firebaseConfig) {
    // Deliberately not a failure. A red row here would read as "Firebase is
    // blocked" at a glance, which is the opposite of what an absent config means.
    set('firebase', 'idle', 'skipped — fill in src/firebase-config.js');
    return;
  }
  set('firebase', 'running', 'connecting');
  const t0 = performance.now();

  const [{ initializeApp }, db] = await withTimeout(Promise.all([
    import(`${CDN}/firebase-app.js`),
    import(`${CDN}/firebase-database.js`),
  ]), TIMEOUT_MS, 'firebase import');

  const app = initializeApp(firebaseConfig, `probe-${Date.now()}`);
  const database = db.getDatabase(app);

  // .info/connected is Firebase's own liveness signal — true only once the
  // transport is actually established, which is the thing being measured.
  await withTimeout(new Promise((resolve, reject) => {
    const unsubscribe = db.onValue(
      db.ref(database, '.info/connected'),
      (snapshot) => {
        if (snapshot.val() === true) {
          unsubscribe();
          resolve();
        }
      },
      (error) => reject(new Error(error.message)),
    );
  }), TIMEOUT_MS, 'connect');
  const connectedAt = since(t0);

  // A real round trip through the server, not a local echo: write, then read
  // back with a fresh get so the value has genuinely made the journey.
  const t1 = performance.now();
  const probeRef = db.ref(database, `probe/${Date.now()}`);
  const payload = { at: Date.now(), agent: navigator.userAgent.slice(0, 120) };
  await withTimeout(db.set(probeRef, payload), TIMEOUT_MS, 'write');
  const snapshot = await withTimeout(db.get(probeRef), TIMEOUT_MS, 'read');
  if (snapshot.val()?.at !== payload.at) throw new Error('read back did not match write');
  await db.remove(probeRef).catch(() => {});

  set('firebase', 'pass', `connected ${connectedAt}, round trip ${since(t1)}`);
}

// --- input probe (passive) ------------------------------------------------

// The documented vocabulary is the four arrows plus Enter. This records what
// the hardware actually delivers, which is worth confirming while the glasses
// are already on. It is also how the page is re-run, since there is no other
// input channel on the device.

const EXPECTED = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'];
const short = (key) => key.replace('Arrow', '');
const seen = new Set();

function renderInput() {
  const missing = EXPECTED.filter((key) => !seen.has(key));
  const label = [...seen].map(short).join(' ') || 'none';
  document.getElementById('keys').innerHTML =
    `Keys seen: <strong>${label}</strong> — press Enter to re-run`;

  if (seen.size === 0) {
    set('input', 'idle', `press all 5: ${EXPECTED.map(short).join(' ')}`);
  } else if (missing.length === 0) {
    set('input', 'pass', 'all 5 keys delivered');
  } else {
    set('input', 'running', `still missing: ${missing.map(short).join(' ')}`);
  }
}

window.addEventListener('keydown', (event) => {
  seen.add(event.key);
  renderInput();
  if (event.key === 'Enter') runAll();
});

// --- runner ---------------------------------------------------------------

const SEQUENCE = [
  ['fetch', probeFetch],
  ['import', probeImport],
  ['websocket', probeWebSocket],
  ['firebase', probeFirebase],
];

let running = false;

async function runAll() {
  if (running) return;
  running = true;
  document.getElementById('verdict').textContent = 'Running…';

  for (const [id, probe] of SEQUENCE) {
    try {
      await probe();
    } catch (error) {
      set(id, 'fail', String(error.message || error).slice(0, 90));
    }
  }

  document.getElementById('verdict').textContent = verdictFor();
  running = false;
}

function verdictFor() {
  const statuses = SEQUENCE.map(([id]) => state.get(id).status);
  if (statuses.every((status) => status === 'pass')) {
    return 'Firebase multiplayer is viable. Build the game.';
  }
  if (state.get('fetch').status === 'fail') {
    return 'No third-party network at all. Redesign required.';
  }
  if (!firebaseConfig) {
    return 'Network works. Add a Firebase config to confirm.';
  }
  return 'Partial. Read the failing row above.';
}

buildDom();
renderInput();
runAll();
</script>
</body>
</html>
